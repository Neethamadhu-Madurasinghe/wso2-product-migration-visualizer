      { 'font-size': 9.5, fill: C.ok, 'font-family': 'ui-monospace, SFMono-Regular, Menlo, monospace' }));
    return g;
  }

  const solid = (color, extra = {}) => ({ fill: 'none', stroke: color, 'stroke-opacity': 0.6, 'stroke-width': 2, ...extra });
  // A connector that starts hidden and is "drawn" by the timeline.
  function drawable(parent, pts) {
    const p = el('path', { d: toD(pts), ...solid(C.db) }, parent);
    const len = p.getTotalLength();
    p.setAttribute('stroke-dasharray', len);
    p.setAttribute('stroke-dashoffset', len);
    return p;
  }

  // Build the nodes of one environment. Returns { gw, cp, tm, all } where, for all-in-one,
  // gw and cp are the same box and tm is null.
  function buildNodes(parent, dy, version, accent, statusSets) {
    if (!isDist()) {
      const box = apimBox(parent, 370, 90 + dy, version, accent, statusSets.aio);
      return { gw: box, cp: box, tm: null, all: [box] };
    }
    const gw = nodeBox(parent, 370, 78 + dy, 'Gateway', version, accent, statusSets.gw);
    const cp = nodeBox(parent, 370, 150 + dy, 'Control Plane', version, accent, statusSets.cp);
    const tm = nodeBox(parent, 370, 222 + dy, 'Traffic Manager', version, accent, statusSets.tm);
    return { gw, cp, tm, all: [gw, cp, tm] };
  }

  const SRC_STATUS = {
    aio: { run: ['Running · serving traffic', C.ok], frozen: ['Running · changes frozen', C.warn],
      stopped: ['Stopped · kept for rollback', C.muted], standby: ['Standby · rollback option', C.muted] },
    gw: { run: ['Serving traffic', C.ok], stopped: ['Stopped', C.muted], standby: ['Standby', C.muted] },
    cp: { run: ['Running', C.ok], frozen: ['Running · changes frozen', C.warn],
      stopped: ['Stopped · kept for rollback', C.muted], standby: ['Standby · rollback option', C.muted] },
    tm: { run: ['Running', C.ok], stopped: ['Stopped', C.muted], standby: ['Standby', C.muted] },
  };
  const VM_STATUS = {
    ready: ['All-in-one · migration only', C.muted], migId: ['Migrating identity data', C.warn],
    migApim: ['Migrating API Manager data', C.warn], stepDone: ['Migration step done', C.muted],
  };
  const KM_STATES = {
    kmSetup: ['Running · connecting IS as KM', C.ok], kmStop: ['Stopped · for KM conversion', C.muted] };
  const IS_SRC_STATUS = { run: ['Running · Key Manager', C.ok], frozen: ['Running · changes frozen', C.warn],
    stopped: ['Stopped · kept for rollback', C.muted], standby: ['Standby · rollback option', C.muted] };
  const IS_TGT_STATUS = { installed: ['Not started', C.muted], freshTest: ['Testing use cases', C.ok],
    ready: ['Stopped · tested', C.muted], migIs: ['Migrating IS data', C.warn], stepDone: ['Stopped · migration done', C.muted],
    kmSetup: ['Running · third-party KM', C.ok], kmStop: ['Stopped · for KM conversion', C.muted],
    tested: ['Running · Key Manager', C.ok] };
  const IS_VM_STATUS = { ready: ['All-in-one · migration only', C.muted], migIs: ['Migrating IS data', C.warn],
    stepDone: ['Migration done', C.muted] };
  const TGT_STATUS = {
    aio: { installed: ['Installed · not started', C.muted], migId: ['Migrating identity data', C.warn],
      migApim: ['Migrating API Manager data', C.warn], stepDone: ['Stopped · migration step done', C.muted],
      tested: ['Running · tested, no traffic', C.ok], serving: ['Running · serving traffic', C.ok],
      freshTest: ['Testing use cases · fresh DBs', C.ok], ready: ['Stopped · tested, ready for data', C.muted], ...KM_STATES },
    gw: { installed: ['Not started', C.muted], tested: ['Running · no traffic yet', C.ok], serving: ['Serving traffic', C.ok],
      freshTest: ['Testing use cases · fresh DBs', C.ok], ready: ['Stopped · tested', C.muted],
      kmSetup: ['Running', C.ok], kmStop: ['Stopped', C.muted] },
    cp: { installed: ['Not started', C.muted], migId: ['Migrating identity data', C.warn],
      migApim: ['Migrating API Manager data', C.warn], stepDone: ['Stopped · step done', C.muted],
      tested: ['Running · tested', C.ok], freshTest: ['Testing use cases · fresh DBs', C.ok], ready: ['Stopped · tested', C.muted],
      ...KM_STATES },
    tm: { installed: ['Not started', C.muted], tested: ['Running', C.ok],
      freshTest: ['Testing use cases · fresh DBs', C.ok], ready: ['Stopped · tested', C.muted],
      kmSetup: ['Running', C.ok], kmStop: ['Stopped', C.muted] },
  };

  function buildScene(scn, mode) {
    const src = SRC;
    const G = GEO[DEP];
    // IS mode is wider; temporary VMs then sit in an extra row below the target environment.
    const W = hasIs() ? 1700 : 1200, H = hasIs() && (useTempNode(scn) || isK8s()) ? 790 : 690;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = '';
    const defs = el('defs', {}, svg);
    defs.innerHTML = `
      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>`;
    const layerBg = el('g', {}, svg);
    const layerLinks = el('g', {}, svg);
    const envSrc = el('g', {}, svg);
    const envTgt = el('g', {}, svg);
    const layerTraffic = el('g', {}, svg);
    const layerTop = el('g', {}, svg);
    const s = { layerTraffic, G };

    // Live status panel (top-left), updated every frame from the timeline position.
    const panel = el('g', {}, layerBg);
    el('rect', { x: 24, y: 24, width: 290, height: 116, rx: 12, fill: C.panel, stroke: C.line }, panel);
    txt(panel, 40, 54, 'API calls', { 'font-size': 13, fill: C.muted });
    txt(panel, 40, 88, 'Changes', { 'font-size': 13, fill: C.muted });
    txt(panel, 40, 122, 'Served by', { 'font-size': 13, fill: C.muted });
    s.stApi = pill(panel, 124, 37, 176, '', C.ok);
    s.stChg = pill(panel, 124, 71, 176, '', C.ok);
    s.stBy = txt(panel, 124, 122, '', { 'font-size': 13, 'font-weight': 600 });

    // Clients
    CLIENTS.forEach(([x, y]) => {
      const g = el('g', {}, layerBg);
      el('circle', { cx: x, cy: y - 9, r: 7, fill: '#2b3654', stroke: C.muted }, g);
      el('path', { d: `M${x - 13},${y + 14} a13,11 0 0 1 26,0 z`, fill: '#2b3654', stroke: C.muted }, g);
    });
    txt(layerBg, 78, 470, 'API clients', { 'text-anchor': 'middle', fill: C.muted, 'font-size': 13 });

    // Load balancer
    s.lbRect = el('rect', { x: 170, y: 310, width: 120, height: 100, rx: 12, fill: C.panel, stroke: C.old, 'stroke-width': 2, filter: 'url(#shadow)' }, layerBg);
    txt(layerBg, 230, 334, 'Load balancer', { 'text-anchor': 'middle', 'font-size': 13 });
    txt(layerBg, 230, 351, '/ DNS', { 'text-anchor': 'middle', 'font-size': 12, fill: C.muted });
    s.lbArrow = el('g', {}, layerBg);
    el('line', { x1: 230, y1: 376, x2: 266, y2: 376, stroke: C.text, 'stroke-width': 3, 'stroke-linecap': 'round' }, s.lbArrow);
    el('path', { d: 'M266,376 l-9,-6 v12 z', fill: C.text }, s.lbArrow);
    el('circle', { cx: 230, cy: 376, r: 4, fill: C.text }, layerBg);
    s.lbDown = badge(layerTop, 168, 274, 124, 'Maintenance', C.bad);

    // Backend (shared by both versions)
    const be = el('g', { filter: 'url(#shadow)' }, layerBg);
    const bx = BE_X();
    el('rect', { x: bx, y: 290, width: 210, height: 140, rx: 12, fill: C.panel, stroke: C.backend, 'stroke-width': 2 }, be);
    txt(be, bx + 20, 318, 'Backend services', { 'font-size': 14, 'font-weight': 600, fill: C.backend });
    txt(be, bx + 20, 336, 'your APIs’ real implementation', { 'font-size': 11, fill: C.muted });
    [350, 372, 394].forEach((y) => {
      el('rect', { x: bx + 20, y, width: 170, height: 16, rx: 4, fill: '#12302f', stroke: C.backend, 'stroke-opacity': 0.5 }, be);
      el('circle', { cx: bx + 30, cy: y + 8, r: 2.5, fill: C.backend }, be);
      el('circle', { cx: bx + 39, cy: y + 8, r: 2.5, fill: C.backend, 'fill-opacity': 0.5 }, be);
    });
    if (isDist()) {
      const note = el('g', {}, layerBg);
      ['Generalized distributed view:', 'Gateway, Control Plane and', 'Traffic Manager stand for all', 'distributed patterns.']
        .forEach((line, i) => txt(note, 30, 520 + i * 16, line, { 'font-size': 11.5, fill: C.muted, 'font-style': 'italic' }));
    }

    // Links: LB -> nodes, gateway -> backend
    const dashed = (color, extra = {}) => ({ fill: 'none', stroke: color, 'stroke-opacity': 0.55, 'stroke-width': 2, 'stroke-dasharray': '4 6', ...extra });
    s.linkSrc = el('path', { d: toD(linkPts(G, 0)), ...dashed(C.old) }, layerLinks);
    s.linkTgt = el('path', { d: toD(linkPts(G, DY)), ...dashed(C.neu), opacity: 0 }, layerLinks);
    s.laneSrcPts = lanePts(G, 0, hasIs() ? 1415 : 930, BACKEND_PORT.src);
    s.laneTgtPts = lanePts(G, DY, hasIs() ? 1430 : 945, BACKEND_PORT.tgt);
    s.laneSrc = el('path', { d: toD(s.laneSrcPts), ...dashed(C.backend) }, layerLinks);
    s.laneTgt = el('path', { d: toD(s.laneTgtPts), ...dashed(C.backend), opacity: 0 }, layerLinks);

    const depLabel = isDist() ? ' · DISTRIBUTED' : '';
    // Source environment
    s.envSrc = envSrc;
    const RW = hasIs() ? 1050 : 560;
    region(envSrc, 340, 40, RW, 262, `PRODUCTION · APIM ${src}${depLabel}`, C.old);
    s.connSrc = G.cpDb(0).map((pts) => el('path', { d: toD(pts), ...solid(C.db) }, envSrc));
    if (G.tmDb) el('path', { d: toD(G.tmDb(0)), ...solid(C.db) }, envSrc);
    if (G.gwDb && gwUsesDb(src)) el('path', { d: toD(G.gwDb(0)), ...solid(C.db) }, envSrc);
    const interStyle = { fill: 'none', stroke: C.muted, 'stroke-opacity': 0.7, 'stroke-width': 1.5, 'stroke-dasharray': '2 3' };
    if (G.inter) G.inter(0).forEach((pts) => el('path', { d: toD(pts), ...interStyle }, envSrc));
    s.src = buildNodes(envSrc, 0, src, C.old, SRC_STATUS);
    s.dbSrcS = cylinder(envSrc, 690, 148, 'SHARED_DB', hasIs() ? 'shared with IS' : `schema ${src}`);
    s.dbSrcA = cylinder(envSrc, 810, 148, 'APIM_DB', hasIs() && KMDB === 'both' ? 'shared with IS' : `schema ${src}`);
    const kmStyle = { fill: 'none', stroke: C.is, 'stroke-opacity': 0.8, 'stroke-width': 2 };
    if (hasIs()) {
      // Source IS: connected to the shared DBs (and its own IDENTITY_DB) and to APIM as the Key Manager.
      txt(envSrc, 925, 66, `KEY MANAGER · ${isNameFor(src)}`, { 'font-size': 12, fill: C.is, 'letter-spacing': 1.5, 'font-weight': 600 });
      const [ix, iy] = IS.node(0);
      const srcLinks = [IS.common(0).S, KMDB === 'both' ? IS.common(0).A : IS.own(0).I];
      s.isSrcLinkPts = srcLinks;
      s.isSrcLinkEls = srcLinks.map((pts) => el('path', { d: toD(pts), ...solid(C.db) }, envSrc));
      if (KMDB === 'shared') s.dbSrcIsI = cylinder(envSrc, IS.I_X, 148, 'IDENTITY_DB', `IS ${IS_FOR[src][1]}`);
      el('path', { d: toD(IS.km(0)), ...kmStyle, 'stroke-dasharray': '6 4' }, envSrc);
      txt(envSrc, 1060, 289, 'Key Manager', { 'text-anchor': 'middle', 'font-size': 10.5, fill: C.is });
      const [kind, ver] = IS_FOR[src];
      s.isSrc = nodeBox(envSrc, ix, iy, kind === 'IS-KM' ? 'WSO2 IS-KM' : 'WSO2 IS', ver, C.old, IS_SRC_STATUS, IS.nodeW);
    }
    s.srcAll = [...s.src.all, s.isSrc].filter(Boolean);
    s.freezeBadge = badge(layerTop, 690, 52, 190, '🔒 Changes frozen', C.warn);
    // shown once the old setup is greyed out after the switch (same spot as the freeze badge)
    s.rollbackBadge = badge(layerTop, 680, 52, 210, '↩ Rollback option if needed', C.old);

    // Target environment
    s.regionTgt = region(envTgt, 340, 40 + DY, RW, 262, `NEW · APIM ${TARGET}${depLabel}${isK8s() ? ' · KUBERNETES' : ''}`, C.neu);
    s.interTgt = G.inter ? G.inter(DY).map((pts) => el('path', { d: toD(pts), ...interStyle, opacity: 0 }, envTgt)) : [];
    s.connTgtCp = G.cpDb(DY).map((pts) => drawable(envTgt, pts));
    s.connTgtTm = G.tmDb ? drawable(envTgt, G.tmDb(DY)) : null;
    s.connTgtGw = G.gwDb && gwUsesDb(TARGET) ? drawable(envTgt, G.gwDb(DY)) : null;
    s.tgt = buildNodes(envTgt, DY, TARGET, C.grey, TGT_STATUS);
    // Target database slots: APIM's two, plus IS's own ones when the DBs are split (or IDENTITY_DB
    // when only SHARED_DB is shared).
    const slots = [[690, 'SHARED_DB'], [810, 'APIM_DB']];
    if (isSplit()) slots.push([IS.S_X, 'SHARED_DB'], [IS.I_X, 'IDENTITY_DB']);
    else if (isMerged() && KMDB === 'shared') slots.push([IS.I_X, 'IDENTITY_DB']);
    s.placeholders = el('g', {}, envTgt);
    slots.forEach(([cx]) => placeholder(s.placeholders, cx, 148 + DY));
    // Fresh, empty databases used only to test the new setup before the real data arrives.
    s.fresh = slots.map(([cx, name]) => {
      const d = cylinder(envTgt, cx, 148 + DY, name, 'FRESH · EMPTY', null, DB_LOOK.fresh);
      d.rows.forEach((r) => r.setAttribute('opacity', 0));
      d.schemaA.setAttribute('fill', C.fresh);
      d.schemaA.setAttribute('font-weight', 600);
      return d;
    });
    s.cfgBadge = hasIs()
      ? badge(layerTop, 610, 326, 430, `⚙ APIM ${TARGET} + IS ${isTgtVer()}: migrated configs & customizations`, C.neu)
      : badge(layerTop, 610, 326, 290, `⚙ ${TARGET}: migrated configs & customizations`, C.neu);
    s.passBadge = badge2(layerTop, 745, 387, 140, ['✓ Basic tests &', 'use cases passed'], C.ok);
    s.dbTgtS = cylinder(envTgt, 690, 148 + DY, 'SHARED_DB', isMerged() ? 'shared copy' : `${src} copy`, SCENARIOS[scn].sharedAfter());
    s.dbTgtA = cylinder(envTgt, 810, 148 + DY, 'APIM_DB', isMerged() && KMDB === 'both' ? 'shared copy' : `${src} copy`);
    // where each target copy comes from (x offset from its source DB)
    s.copies = [[s.dbTgtS, 0], [s.dbTgtA, 0]];
    if (isSplit()) {
      s.dbTgtIsS = cylinder(envTgt, IS.S_X, 148 + DY, 'SHARED_DB', 'IS copy', `IS ${isTgtVer()}`);
      s.dbTgtIsI = cylinder(envTgt, IS.I_X, 148 + DY, 'IDENTITY_DB', 'IS copy', `IS ${isTgtVer()}`);
      s.copies.push([s.dbTgtIsS, 690 - IS.S_X], [s.dbTgtIsI, KMDB === 'both' ? 810 - IS.I_X : 0]);
    } else if (isMerged() && KMDB === 'shared') {
      s.dbTgtIsI = cylinder(envTgt, IS.I_X, 148 + DY, 'IDENTITY_DB', 'IS copy', `IS ${isTgtVer()}`);
      s.copies.push([s.dbTgtIsI, 0]);
    }

    // Target IS node, its DB links and the Key Manager link
    if (hasIs()) {
      s.isTgtLabel = txt(envTgt, 925, 66 + DY, `KEY MANAGER · IS ${isTgtVer()}`, { 'font-size': 12, fill: C.is, 'letter-spacing': 1.5, 'font-weight': 600 });
      const tgtLinks = isSplit() ? [IS.own(DY).S, IS.own(DY).I]
        : [IS.common(DY).S, KMDB === 'both' ? IS.common(DY).A : IS.own(DY).I];
      s.isTgtLinkPts = tgtLinks;
      s.isTgtLinks = tgtLinks.map((pts) => drawable(envTgt, pts));
      s.kmTgt = drawable(envTgt, IS.km(DY));
      s.kmTgt.setAttribute('stroke', C.is);
      s.kmTgt.setAttribute('stroke-opacity', 0.8);
      s.kmTgtLabel = txt(envTgt, 1060, 289 + DY, 'Key Manager', { 'text-anchor': 'middle', 'font-size': 10.5, fill: C.is, opacity: 0 });
      const [ix, iy] = IS.node(DY);
      s.isTgt = nodeBox(envTgt, ix, iy, 'WSO2 IS', isTgtVer(), C.grey, IS_TGT_STATUS, IS.nodeW);
    }
    s.tgtAll = [...s.tgt.all, s.isTgt].filter(Boolean);

    // Migration script documents
    s.sqlDoc = sqlDocIcon(layerTop, 'migration.sql');
    s.kmDoc = sqlDocIcon(layerTop, 'km-conversion.sql');

    // Migration clients (used by scenarios that need them)
    s.jarId = jarIcon(layerTop, 'Identity migration', 'org.wso2.carbon.is.migration-x.x.x.jar');
    const clientVer = scn === 'twostep' ? VIA : TARGET;
    s.jarApim = jarIcon(layerTop, 'API-M migration', `org.wso2.carbon.apimgt.migrate.client-${clientVer}.x.jar`);
    if (useTempNode(scn)) {
      const title = scn === 'twostep' && !isK8s() ? 'Temporary node' : 'Temporary VM';
      s.vm = tempVm(layerTop, vmGeo(), vmGeo().links, title, clientVer, VM_STATUS);
      s.vmLinks = s.vm.links;
    }
    if (hasIs()) {
      s.jarIs = jarIcon(layerTop, 'IS migration', 'org.wso2.carbon.is.migration-x.x.x.jar (IS migration client)');
      if (isK8s()) s.isVm = tempVm(layerTop, VM_IS.is, VM_IS.is.links(), 'Temporary VM', `IS ${isTgtVer()}`, IS_VM_STATUS);
      s.termIs = terminal(layerTop, isK8s() ? VM_IS.is.term : IS.term, '-Dmigrate -Dcomponent=identity', 225);
    }
    const term = s.vm ? vmGeo().term : G.term, termW = s.vm ? (hasIs() ? 240 : 225) : 250;
    s.termId = terminal(layerTop, term, '-Dmigrate -Dcomponent=identity', termW);
    s.termApim = terminal(layerTop, term, scn === 'twostep' || TARGET === VIA
      ? [`-Dmigrate -DmigrateFromVersion=${src}`, `-DmigratedVersion=${VIA}`]
      : `-Dmigrate -DmigrateFromVersion=${src}`, termW);
    if (scn === 'twostep') {
      // a third label for the second schema change (4.2.0 -> target)
      [[s.dbTgtS, 690, `ready for ${TARGET}`], [s.dbTgtA, 810, `schema ${TARGET}`]].forEach(([db, cx, label]) => {
        db.schemaC = txt(db.g, cx, 148 + DY + 49, label, { 'text-anchor': 'middle', 'font-size': 10, fill: C.ok, opacity: 0 });
      });
      s.dbTgtA.schemaB.textContent = `schema ${VIA}`;
    }

    // Legend
    const lg = el('g', {}, layerBg);
    [[C.packet, 'API call (client → gateway → backend)'], [C.db, 'Data change (new API, app, subscription)'],
     [C.bad, 'API call rejected']].forEach(([color, label], i) => {
      const x = [40, 310, 590][i];
      el('circle', { cx: x, cy: H - 20, r: 5, fill: color }, lg);
      txt(lg, x + 12, H - 15.5, label, { 'font-size': 12, fill: C.muted });
    });
    if (isDist()) {
      el('line', { x1: 734, y1: H - 20, x2: 752, y2: H - 20, ...interStyle }, lg);
      txt(lg, 760, H - 15.5, 'Node-to-node link', { 'font-size': 12, fill: C.muted });
    }
    el('rect', { x: 914, y: H - 27, width: 14, height: 14, rx: 3, fill: DB_LOOK.fresh.body, stroke: C.fresh }, lg);
    txt(lg, 936, H - 15.5, 'Fresh test database', { 'font-size': 12, fill: C.muted });
    if (hasIs()) {
      el('line', { x1: 1100, y1: H - 20, x2: 1122, y2: H - 20, ...kmStyle, 'stroke-dasharray': '6 4' }, lg);
      txt(lg, 1130, H - 15.5, 'Key Manager link (IS ↔ APIM)', { 'font-size': 12, fill: C.muted });
    }

    // Initial state
    gsap.set([s.regionTgt, s.isTgtLabel, ...s.tgtAll.map((b) => b.g), s.placeholders, s.linkTgt, s.lbDown, s.freezeBadge, s.rollbackBadge,
      s.termId, s.termApim, s.termIs].filter(Boolean), { opacity: 0 });
    gsap.set([s.sqlDoc, s.kmDoc], { x: FLY_X(), y: 250, opacity: 0 });
    gsap.set([s.jarId, s.jarApim, s.jarIs].filter(Boolean), { x: FLY_X(), y: 420, opacity: 0 });
    gsap.set([s.vm, s.isVm].filter(Boolean).map((v) => v.g), { opacity: 0 });
    gsap.set([...s.fresh.map((d) => d.g), s.cfgBadge, s.passBadge], { opacity: 0 });
    gsap.set(s.lbArrow, { rotation: -38, svgOrigin: '230 376' });
    return s;
  }

  // ---------- timeline building blocks ----------
  const HOLD = 3.2;
  const wait = (tl, d = HOLD) => tl.to({}, { duration: d });

  function showStatus(tl, box, key, pos) {
    const others = Object.entries(box.status).filter(([k]) => k !== key).map(([, p]) => p);
    tl.to(others, { opacity: 0, duration: 0.3 }, pos);
    tl.to(box.status[key], { opacity: 1, duration: 0.3 }, '<0.15');
  }

  // Fly the SQL document in from the right and drop it into the database at cx.
  function flyDoc(tl, doc, cx) {
    tl.fromTo(doc, { opacity: 0, x: FLY_X(), y: 250, scale: 1 },
      { opacity: 1, x: cx - 35, y: 360, duration: 1.3, ease: 'power2.out' });
    tl.to(doc, { y: 480, scale: 0.3, opacity: 0, transformOrigin: '50% 100%', duration: 0.6, ease: 'power2.in' }, '+=0.7');
  }

  // Visible change to a database: glow, some rows turn green, maybe a new row,
  // maybe the schema label switches to the target version.
  function dbUpdate(tl, db, { rows = [], add = false, swap = false }, pos) {
    tl.to(db.halo, { opacity: 0.6, duration: 0.3 }, pos);
    rows.forEach((r, i) => tl.to(db.rows[r], { attr: { fill: C.ok }, duration: 0.5 }, i === 0 ? '<' : '<0.25'));
    if (add) {
      tl.fromTo(db.newRow, { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, transformOrigin: '0% 50%', duration: 0.5 }, '<0.25');
    }
    if (swap) {
      tl.to(db.schemaA, { opacity: 0, duration: 0.3 }, '<');
      tl.to(db.schemaB, { opacity: 1, duration: 0.3 }, '<0.15');
    }
    tl.to(db.halo, { opacity: 0, duration: 0.7 });
  }

  function draw(tl, paths, pos) {
    paths.filter(Boolean).forEach((p, i) =>
      tl.to(p, { attr: { 'stroke-dashoffset': 0 }, duration: 0.8, ease: 'none' }, i === 0 ? pos : '<0.1'));
  }
  function undraw(tl, paths, pos) {
    paths.filter(Boolean).forEach((p, i) =>
      tl.to(p, { attr: { 'stroke-dashoffset': p.getTotalLength() }, duration: 0.5, ease: 'none' }, i === 0 ? pos : '<'));
  }

  // Bring a target node to life: border and version turn blue, status changes.
  function activate(tl, box, statusKey, pos) {
    tl.to(box.rect, { attr: { stroke: C.neu }, duration: 0.5 }, pos);
    tl.to(box.ver, { attr: { fill: C.neu }, duration: 0.5 }, '<');
    showStatus(tl, box, statusKey, '<');
  }

  // Copy a migration client JAR into the node that runs migrations (AIO node or Control Plane),
  // start it in migration mode, let it change the databases, then stop it and remove the JAR.
  // Adds labels <name>Run / <name>Done; the traffic loop shows DB writes between them.
  // opts.node / opts.jar / opts.links override where the client runs (used for the IS migration).
  function runClient(tl, s, jar, term, statusKey, name, changes, opts = {}) {
    const { land, into } = opts.jar || (s.vm ? vmGeo().jar : s.G.jar);
    const node = opts.node || s.vm || s.tgt.cp;
    const links = 'links' in opts ? opts.links : (s.vm ? null : s.connTgtCp);
    tl.fromTo(jar, { opacity: 0, x: FLY_X(), y: 420, scale: 1 },
      { opacity: 1, x: land[0], y: land[1], duration: 1.2, ease: 'power2.out' });
    tl.to(jar, { x: into[0], y: into[1], scale: 0.35, opacity: 0, transformOrigin: '50% 50%', duration: 0.6, ease: 'power2.in' }, '+=0.5');
    if (links) draw(tl, links);
    tl.to(term, { opacity: 1, duration: 0.4 }, '<');
    tl.to(node.rect, { attr: { stroke: C.warn }, duration: 0.4 }, '<');
    showStatus(tl, node, statusKey, '<');
    tl.addLabel(name + 'Run');
    wait(tl, 1.6);
    changes();
    tl.addLabel(name + 'Done');
    tl.to(term, { opacity: 0, duration: 0.4 }, '+=0.4');
    tl.to(node.rect, { attr: { stroke: C.grey }, duration: 0.4 }, '<');
    showStatus(tl, node, 'stepDone', '<');
    // the JAR is taken out again
    tl.fromTo(jar, { opacity: 0, x: into[0], y: into[1], scale: 0.35 },
      { opacity: 0.9, x: into[0] + 55, y: land[1], scale: 0.6, duration: 0.5, ease: 'power2.out', immediateRender: false });
    tl.to(jar, { opacity: 0, y: land[1] - 40, duration: 0.5 });
  }

  // IS migration: on the target IS node, or on a temporary IS VM for Kubernetes targets.
  function isTimeline(tl, s) {
    tl.addLabel('ismig');
    if (s.isVm) {
      tl.fromTo(s.isVm.g, { opacity: 0 }, { opacity: 1, duration: 0.8 });
      draw(tl, s.isVm.links, '+=0.2');
    }
    runClient(tl, s, s.jarIs, s.termIs, 'migIs', 'ismig', () => {
      if (isSplit()) {
        dbUpdate(tl, s.dbTgtIsS, { rows: [0, 1], swap: true });
        dbUpdate(tl, s.dbTgtIsI, { rows: [0, 2], add: true, swap: true }, '<');
      } else {
        // shared DBs: the IS migration also changes API Manager's databases
        dbUpdate(tl, s.dbTgtS, { rows: [0] });
        if (KMDB === 'both') dbUpdate(tl, s.dbTgtA, { rows: [0] }, '<');
        else dbUpdate(tl, s.dbTgtIsI, { rows: [0, 1], add: true, swap: true }, '<');
      }
    }, {
      node: s.isVm || s.isTgt,
      jar: s.isVm ? VM_IS.is.jar : IS.jar,
      links: s.isVm ? null : s.isTgtLinks,
    });
    if (s.isVm) {
      undraw(tl, s.isVm.links, '+=0.3');
      tl.to(s.isVm.g, { opacity: 0, duration: 0.7 });
    }
    wait(tl);
  }

  // Target 4.2.0 with IS 6.1.0: only the API Manager component migration runs.
  function mergedApimTimeline(tl, s) {
    if (s.vm) {
      tl.addLabel('tempvm');
      tl.fromTo(s.vm.g, { opacity: 0 }, { opacity: 1, duration: 0.8 });
      draw(tl, s.vmLinks, '+=0.2');
      wait(tl);
    }
    tl.addLabel('apimig');
    runClient(tl, s, s.jarApim, s.termApim, 'migApim', 'apimig', () => {
      dbUpdate(tl, s.dbTgtA, { rows: [1, 2], add: true, swap: true });
      dbUpdate(tl, s.dbTgtS, { rows: [1, 2], add: true, swap: true }, '<');
    });
    wait(tl);
    if (s.vm) {
      tl.addLabel('removevm');
      undraw(tl, s.vmLinks);
      tl.to(s.vm.g, { opacity: 0, duration: 0.7 });
      wait(tl, 2.4);
    }
  }

  // Target 4.3.0+: connect IS 7.x as a third-party KM, then stop both and convert it to resident.
  function kmConversionTimeline(tl, s) {
    const apim = s.tgt.all;
    tl.addLabel('connectkm');
    draw(tl, [...s.connTgtCp, s.connTgtTm, s.connTgtGw, ...s.isTgtLinks]);
    apim.forEach((b, i) => activate(tl, b, 'kmSetup', i ? '<0.2' : undefined));
    activate(tl, s.isTgt, 'kmSetup', '<0.2');
    // Connected, but not usable for the migrated data until the conversion script runs: grey.
    tl.set(s.kmTgt, { attr: { stroke: C.grey } }, '+=0.3');
    tl.set(s.kmTgtLabel, { attr: { fill: C.grey } }, '<');
    draw(tl, [s.kmTgt], '<');
    tl.to(s.kmTgtLabel, { opacity: 1, duration: 0.4 }, '<');
    wait(tl);

    tl.addLabel('convert');
    s.tgtAll.forEach((b, i) => {
      showStatus(tl, b, 'kmStop', i ? '<' : undefined);
      tl.to(b.rect, { attr: { stroke: C.grey }, duration: 0.4 }, '<');
    });
    flyDoc(tl, s.kmDoc, 810);
    dbUpdate(tl, s.dbTgtA, { rows: [0, 1, 2] });
    // the Key Manager connection is now live
    tl.to(s.kmTgt, { attr: { stroke: C.is }, duration: 0.6 }, '-=0.2');
    tl.to(s.kmTgtLabel, { attr: { fill: C.is }, duration: 0.6 }, '<');
    wait(tl);
  }

  function buildTimeline(scn, mode, s) {
    const tl = gsap.timeline({ paused: true, onComplete: () => setPlayLabel() });
    const srcBoxes = s.srcAll, tgtBoxes = s.tgtAll;

    tl.addLabel('running', 0);
    wait(tl, 4);

    tl.addLabel('build');
    tl.to([s.regionTgt, s.isTgtLabel].filter(Boolean), { opacity: 1, duration: 0.8 });
    // slide in rather than scale: a scale tween leaves GSAP with an origin offset, which pulls
    // the boxes away from their connector lines
    tl.fromTo(tgtBoxes.map((b) => b.g), { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out', stagger: 0.15 }, '<0.2');
    tl.to(s.placeholders, { opacity: 1, duration: 0.6 });
    wait(tl);

    // Test the new setup with migrated configs and fresh, empty databases, then reset it.
    tl.addLabel('fresh');
    const freshLinks = [...s.connTgtCp, s.connTgtTm, s.connTgtGw, ...(s.isTgtLinks || [])].filter(Boolean);
    const freshDbs = s.fresh.map((d) => d.g);
    tl.fromTo(s.cfgBadge, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' });
    tl.to(s.placeholders, { opacity: 0, duration: 0.4 }, '+=0.3');
    tl.to(freshDbs, { opacity: 1, duration: 0.6, stagger: 0.2 }, '<');
    tl.set(freshLinks, { attr: { stroke: C.fresh } }, '<');
    draw(tl, freshLinks);
    tgtBoxes.forEach((b, i) => activate(tl, b, 'freshTest', i ? '<0.2' : undefined));
    if (s.kmTgt) { draw(tl, [s.kmTgt], '<'); tl.to(s.kmTgtLabel, { opacity: 1, duration: 0.4 }, '<'); }
    if (s.interTgt.length) tl.to(s.interTgt, { opacity: 1, duration: 0.4 }, '<');
    tl.addLabel('freshRun');
    wait(tl, 2.4);
    tl.fromTo(s.passBadge, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(2)' });
    wait(tl, 1.2);
    tl.addLabel('freshDone');
    tgtBoxes.forEach((b, i) => {
      showStatus(tl, b, 'ready', i ? '<' : undefined);
      tl.to(b.rect, { attr: { stroke: C.grey }, duration: 0.4 }, '<');
      tl.to(b.ver, { attr: { fill: C.grey }, duration: 0.4 }, '<');
    });
    freshLinks.forEach((p, i) =>
      tl.to(p, { attr: { 'stroke-dashoffset': p.getTotalLength() }, duration: 0.5, ease: 'none' }, i ? '<' : '+=0.2'));
    if (s.interTgt.length) tl.to(s.interTgt, { opacity: 0, duration: 0.4 }, '<');
    if (s.kmTgt) { undraw(tl, [s.kmTgt], '<'); tl.to(s.kmTgtLabel, { opacity: 0, duration: 0.4 }, '<'); }
    tl.set(freshLinks, { attr: { stroke: C.db } });
    tl.to(freshDbs, { opacity: 0, duration: 0.6 }, '+=0.2');
    tl.to(s.placeholders, { opacity: 1, duration: 0.5 }, '<0.3');
    tl.to(s.passBadge, { opacity: 0, duration: 0.4 }, '<');
    wait(tl, 1.5);

    if (mode === 'downtime') {
      tl.addLabel('stop');
      tl.to(s.lbDown, { opacity: 1, duration: 0.4 });
      tl.to(s.lbRect, { attr: { stroke: C.bad }, duration: 0.4 }, '<');
      // let in-flight calls drain, then shut the source down
      srcBoxes.forEach((b, i) => {
        showStatus(tl, b, 'stopped', i === 0 ? '+=1.6' : '<');
        tl.to(b.rect, { attr: { stroke: C.grey }, duration: 0.5 }, '<');
      });
      tl.to([s.linkSrc, s.laneSrc], { opacity: 0.15, duration: 0.5 }, '<');
    } else {
      tl.addLabel('freeze');
      tl.fromTo(s.freezeBadge, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(2)' });
      tl.to([...s.connSrc, ...(s.isSrcLinkEls || [])], { opacity: 0.25, duration: 0.4 }, '<');
      showStatus(tl, s.src.cp, 'frozen', '<');
      if (s.isSrc) showStatus(tl, s.isSrc, 'frozen', '<');
    }
    wait(tl);

    tl.addLabel('copy');
    tl.to([s.dbSrcS, s.dbSrcA, s.dbSrcIsI].filter(Boolean).map((d) => d.halo), { opacity: 0.55, duration: 0.4, yoyo: true, repeat: 1 });
    s.copies.forEach(([db, dx], i) => tl.fromTo(db.g, { opacity: 0, x: dx, y: -DY },
      { opacity: 1, x: 0, y: 0, duration: 1.8, ease: 'power2.inOut' }, i ? '<0.4' : undefined));
    tl.to(s.placeholders, { opacity: 0, duration: 0.4 }, '-=0.5');
    wait(tl);

    if (hasIs()) isTimeline(tl, s);
    if (isMerged()) mergedApimTimeline(tl, s);
    else SCENARIOS[scn].timeline(tl, s);
    if (isSplit()) kmConversionTimeline(tl, s);

    // Start order: AIO node, or Control Plane -> Traffic Manager -> Gateway.
    tl.addLabel('start');
    draw(tl, s.connTgtCp);
    activate(tl, s.tgt.cp, 'tested');
    if (isDist()) {
      draw(tl, [s.connTgtTm], '+=0.4');
      activate(tl, s.tgt.tm, 'tested');
      if (s.connTgtGw) draw(tl, [s.connTgtGw], '+=0.4');
      activate(tl, s.tgt.gw, 'tested', s.connTgtGw ? undefined : '+=0.4');
    }
    if (s.interTgt.length) tl.to(s.interTgt, { opacity: 1, duration: 0.5 }, '<');
    if (s.isTgt) {
      draw(tl, s.isTgtLinks, '+=0.3');
      activate(tl, s.isTgt, 'tested');
      draw(tl, [s.kmTgt], '<');
      tl.to(s.kmTgtLabel, { opacity: 1, duration: 0.4 }, '<');
    }
    tl.to(s.laneTgt, { opacity: 0.5, duration: 0.5 }, '<');
    wait(tl);

    tl.addLabel('switch');
    tl.to(s.linkTgt, { opacity: 1, duration: 0.5 });
    tl.to(s.laneTgt, { opacity: 1, duration: 0.5 }, '<');
    tl.to(s.lbArrow, { rotation: 38, svgOrigin: '230 376', duration: 0.6, ease: 'back.out(2)' }, '<');
    tl.to(s.lbRect, { attr: { stroke: C.neu }, duration: 0.5 }, '<');
    tl.to(mode === 'downtime' ? s.lbDown : s.freezeBadge, { opacity: 0, duration: 0.4 }, '<');
    showStatus(tl, s.tgt.gw, 'serving', '+=0.4');
    if (mode === 'freeze') {
      tl.to([s.linkSrc, s.laneSrc], { opacity: 0.15, duration: 0.6 }, '<');
      srcBoxes.forEach((b, i) => showStatus(tl, b, 'standby', i === 0 ? '+=1.5' : '<'));
    }
    tl.to(s.envSrc, { opacity: 0.5, duration: 1 }, '+=0.8');
    tl.fromTo(s.rollbackBadge, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(2)' }, '+=0.2');
    wait(tl, 4);
    return tl;
  }

  // What the system is doing at timeline time t. Traffic and the status panel read
  // this every frame, so seeking or stepping backwards always shows the right state.
  function stateAt(mode, tl, t) {
    const L = tl.labels;
    const switched = t >= L.switch + 0.3;
    const migrating = ['identity', 'apimig', 'ismig'].find((n) => L[n + 'Run'] !== undefined && t >= L[n + 'Run'] && t < L[n + 'Done']) || null;
    let st;
    if (mode === 'downtime') {
      const down = t >= L.stop + 0.3 && !switched;
      st = {
        route: down ? null : switched ? 'tgt' : 'src',
        writes: down ? null : switched ? 'tgt' : 'src',
        api: down ? ['Down · maintenance', C.bad] : ['Available', C.ok],
        chg: down ? ['Not possible', C.bad] : ['Allowed', C.ok],
      };
    } else {
      const frozen = t >= L.freeze + 0.3 && !switched;
      st = {
        route: switched ? 'tgt' : 'src',
        writes: frozen ? null : switched ? 'tgt' : 'src',
        api: ['Available', C.ok],
        chg: frozen ? ['Frozen', C.warn] : ['Allowed', C.ok],
      };
    }
    st.migrating = migrating;
    st.freshTest = t >= L.freshRun && t < L.freshDone;
    return st;
  }

  // ---------- app state & controls ----------
  let scn = 'script';
  let mode = 'freeze';
  let tl = null;
  let speed = 1;
  let shownStep = -1;
  let STEPS = [];
  const playerEl = document.getElementById('player');
  const stepsEl = document.getElementById('steps');
  const capNum = document.getElementById('capNum');
  const capTitle = document.getElementById('capTitle');
  const capText = document.getElementById('capText');
  const btnPlay = document.getElementById('btnPlay');
  let stepBtns = [];

  function currentStep(t = tl.time()) {
    let idx = 0;
    STEPS.forEach((s, i) => { if (t >= tl.labels[s.label] - 1e-6) idx = i; });
    return idx;
  }
  function renderCaption() {
    const i = currentStep();
    if (i === shownStep) return;
    shownStep = i;
    const st = STEPS[i];
    capNum.textContent = `Step ${i + 1} of ${STEPS.length}`;
    capTitle.textContent = st.title;
    capText.innerHTML = st.text; // step texts are static strings defined above
    stepBtns.forEach((b, j) => b.classList.toggle('active', j === i));
    if (nar.on) narStart(i);
  }
  let lastPanel = '';
  function renderPanel(st) {
    const by = st.route === 'src' ? `APIM ${SRC}` : st.route === 'tgt' ? `APIM ${TARGET}` : '—';
    const key = st.api[0] + st.chg[0] + by;
    if (key === lastPanel) return;
    lastPanel = key;
    S.stApi.set(...st.api);
    S.stChg.set(...st.chg);
    S.stBy.textContent = by;
    S.stBy.setAttribute('fill', st.route === 'src' ? C.old : st.route === 'tgt' ? C.neu : C.muted);
  }
  function setPlayLabel() {
    btnPlay.textContent = tl.progress() >= 1 ? '⟲ Replay' : playing() ? '❚❚ Pause' : '▶ Play';
  }
  function goTo(i) {
    i = Math.max(0, Math.min(STEPS.length - 1, i));
    narReset();
    shownStep = -1; // re-read the step even if it is the one already shown
    tl.seek(STEPS[i].label, false);
    renderCaption();
    setPlayLabel();
  }

  function load(newScn, newMode, opts = {}) {
    scn = newScn;
    mode = newMode;
    clearTraffic();
    narReset();
    if (tl) tl.kill();
    S = buildScene(scn, mode);
    R = buildRoutes(S);
    tl = buildTimeline(scn, mode, S);
    tl.timeScale(speed);
    tl.eventCallback('onUpdate', narHold);
    STEPS = stepsFor(scn, mode);
    shownStep = -1;
    lastPanel = '';
    document.getElementById('title').textContent = `WSO2 API Manager migration: ${SRC} → ${TARGET}`;
    document.getElementById('chip').textContent = SCENARIOS[scn].name;
    document.getElementById('chipDep').textContent = isDist() ? 'Distributed (generalized)' : 'All-in-one';
    document.getElementById('chipPlat').textContent = isK8s() ? 'Target on Kubernetes' : 'Target on VMs';
    const chipKm = document.getElementById('chipKm');
    chipKm.hidden = !hasIs();
    chipKm.textContent = hasIs() ? `IS as KM · ${KMDB === 'both' ? 'SHARED_DB + APIM_DB shared' : 'SHARED_DB shared'}` : '';
    document.getElementById('subtitle').textContent = MODE_TEXT[mode].subtitle(SRC);
    document.querySelectorAll('.modes button').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
    stepsEl.innerHTML = '';
    stepBtns = STEPS.map((s, i) => {
      const b = document.createElement('button');
      b.textContent = `${i + 1}. ${s.title}`;
      b.onclick = () => goTo(i);
      stepsEl.appendChild(b);
      return b;
    });
    if (opts.step >= 1) {
      // Open paused at the end of that step so its animation is visible.
      const n = Math.min(opts.step, STEPS.length);
      const end = STEPS[n] ? tl.labels[STEPS[n].label] : tl.duration();
      tl.seek(end - 0.01);
    } else {
      tl.play();
    }
    renderCaption();
    renderPanel(stateAt(mode, tl, tl.time()));
    setPlayLabel();
  }

  document.querySelectorAll('.modes button').forEach((b) => {
    b.onclick = () => {
      load(scn, b.dataset.mode);
      syncUrl();
    };
  });
  btnPlay.onclick = () => {
    if (tl.progress() >= 1) { narReset(); shownStep = -1; tl.restart(); }
    else if (playing()) { tl.pause(); narPause(); }
    else { narResume(); if (!nar.holding) tl.play(); }
    setPlayLabel();
  };
  document.getElementById('btnRestart').onclick = () => { clearTraffic(); narReset(); shownStep = -1; tl.restart(); setPlayLabel(); };
  document.getElementById('btnPrev').onclick = () => goTo(currentStep() - 1);
  document.getElementById('btnNext').onclick = () => goTo(currentStep() + 1);
  document.getElementById('speed').onchange = (e) => {
    speed = +e.target.value;
    if (narActive()) narPace(); else tl.timeScale(speed);
  };

  // ---------- narration ----------
  // Reads each step aloud with the browser's own speech engine (no files, works offline and
  // in the exported customer page). While it is on, the voice sets the pace: the animation of a
  // step is slowed so it ends about when the voice does, and if the voice is still talking at
  // the next step it waits there. Speech is queued one sentence at a time because Chrome cuts
  // off long utterances, and pause/resume restarts the current sentence because
  // speechSynthesis.pause() is unreliable across browsers.
  const synth = window.speechSynthesis;
  const btnNarrate = document.getElementById('btnNarrate');
  const selVoice = document.getElementById('voice');
  const nar = {
    on: false, step: -1, parts: [], idx: 0, gen: 0, holdAt: null, holding: false, paused: false,
    wps: 2.6, // spoken words per second at rate 1; recalibrated from each sentence
    voice: null, timer: 0,
  };
  const words = (t) => t.split(/\s+/).filter(Boolean).length;
  const narRate = () => Math.max(0.5, Math.min(2, speed));
  const narActive = () => nar.on && nar.idx < nar.parts.length;
  function playing() { return nar.holding ? !nar.paused : !tl.paused(); }

  // Captions are written to be read; make them sound right when spoken.
  function spokenText(st) {
    const flags = (c) => 'the options ' + c.trim().split(/\s+/).map((f) => {
      const m = f.match(/^-D(\w+)(?:=(.+))?$/);
      if (!m) return f;
      const name = m[1].replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase();
      return m[2] ? `${name} set to ${m[2]}` : name;
    }).join(', ');
    return `${st.title}. ${st.text}`
      .replace(/<code>(.*?)<\/code>/g, (_, c) => flags(c))
      .replace(/<[^>]+>/g, '')
      .replace(/→/g, ' to ')
      .replace(/\s\/\s/g, ' or ')
      .replace(/\bAPIM_DB\b/g, 'A P I M D B')
      .replace(/\b([A-Z]+)_DB\b/g, (_, w) => `${w.toLowerCase()} D B`)
      .replace(/\bAPI-M\b|\bAPIM\b/g, 'A P I M')
      .replace(/\bIS\b/g, 'I S')
      .replace(/\bSQL\b/g, 'S Q L')
      .replace(/\bJAR\b/g, 'jar')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Slow the animation so what is left of this step lasts as long as what is left to say.
  // Never faster than the chosen speed.
  function narPace() {
    if (!narActive()) { tl.timeScale(speed); return; }
    const end = nar.holdAt ?? tl.duration();
    const anim = Math.max(0, end - tl.time());
    let left = 0;
    for (let k = nar.idx; k < nar.parts.length; k++) left += words(nar.parts[k]);
    const talk = left / (nar.wps * narRate());
    tl.timeScale(talk > 0.2 ? Math.max(0.05, Math.min(speed, anim / talk)) : speed);
  }
  // Called on every timeline update: wait just before the next step while the voice is talking.
  function narHold() {
    if (!narActive() || nar.holdAt == null || nar.holding) return;
    if (tl.time() >= nar.holdAt - 0.02) {
      nar.holding = true;
      tl.pause(nar.holdAt - 0.02);
    }
  }
  function narSpeak(g) {
    clearTimeout(nar.timer);
    if (g !== nar.gen || nar.paused) return;
    if (nar.idx >= nar.parts.length) { narDone(); return; }
    narPace();
    const text = nar.parts[nar.idx], n = words(text), rate = narRate();
    const u = new SpeechSynthesisUtterance(text);
    try { if (nar.voice) { u.voice = nar.voice; u.lang = nar.voice.lang; } } catch (e) { /* default voice */ }
    u.rate = rate;
    let t0 = 0;
    const next = () => {
      if (g !== nar.gen) return;
      clearTimeout(nar.timer);
      if (t0 && n >= 4) {
        const wps = n / ((performance.now() - t0) / 1000) / rate;
        if (wps > 0.8 && wps < 6) nar.wps = 0.7 * nar.wps + 0.3 * wps;
      }
      nar.idx++;
      narSpeak(g);
    };
    u.onstart = () => { t0 = performance.now(); };
    u.onend = next;
    u.onerror = next;
    nar.utter = u; // keep a reference: Chrome drops end events of collected utterances
    // watchdog in case the engine never reports the end
    nar.timer = setTimeout(next, (n / (nar.wps * rate)) * 2500 + 4000);
    try { synth.speak(u); } catch (e) { next(); }
  }
  function narDone() {
    tl.timeScale(speed);
    if (nar.holding) {
      nar.holding = false;
      if (!nar.paused) tl.play();
      setPlayLabel();
    }
  }
  function narStart(i) {
    narReset();
    const st = STEPS[i];
    nar.step = i;
    // whole sentences; long ones are also split at ; and : (Chrome stops after ~15 s of speech)
    nar.parts = spokenText(st).split(/(?<=[.!?])\s+/)
      .flatMap((x) => (words(x) > 25 ? x.split(/(?<=[;:])\s+/) : [x])).filter(Boolean);
    nar.holdAt = STEPS[i + 1] ? tl.labels[STEPS[i + 1].label] : null;
    nar.paused = tl.paused();
    narPace();
    const g = nar.gen;
    // Chrome may drop a speak() issued right after cancel()
    if (!nar.paused) setTimeout(() => narSpeak(g), 60);
  }
  // Stop talking and forget the current step. If the timeline was waiting for the voice,
  // let it go on (unless the viewer paused).
  function narReset() {
    nar.gen++;
    clearTimeout(nar.timer);
    if (synth) synth.cancel();
    nar.parts = [];
    nar.idx = 0;
    nar.holdAt = null;
    nar.step = -1;
    if (nar.holding) {
      nar.holding = false;
      if (!nar.paused && tl) tl.play();
    }
    if (tl) tl.timeScale(speed);
  }
  function narPause() {
    if (!nar.on) return;
    nar.paused = true;
    nar.gen++;
    clearTimeout(nar.timer);
    synth.cancel();
  }
  function narResume() {
    if (!nar.on) return;
    nar.paused = false;
    if (narActive()) {
      const g = nar.gen;
      setTimeout(() => narSpeak(g), 60); // restarts the current sentence
    }
  }

  function voiceScore(v) {
    let sc = 0;
    if (/^en[-_]US/i.test(v.lang)) sc += 3; else if (/^en[-_]GB/i.test(v.lang)) sc += 2;
    if (/natural|neural|premium|enhanced/i.test(v.name)) sc += 6;
    if (/^Google/i.test(v.name)) sc += 4;
    if (/Samantha|Daniel|Karen|Serena|Ava|Allison/i.test(v.name)) sc += 2;
    if (v.localService === false) sc += 1;
    return sc;
  }
  function fillVoices() {
    const list = synth.getVoices().filter((v) => /^en/i.test(v.lang))
      .sort((a, b) => voiceScore(b) - voiceScore(a) || a.name.localeCompare(b.name));
    if (!list.length) return;
    let saved = '';
    try { saved = localStorage.getItem('apimMigVoice') || ''; } catch (e) { /* no storage */ }
    selVoice.innerHTML = '';
    list.forEach((v) => {
      const o = document.createElement('option');
      o.value = v.name;
      o.textContent = `${v.name} (${v.lang})`;
      selVoice.appendChild(o);
    });
    const pick = list.find((v) => v.name === saved) || list[0];
    selVoice.value = pick.name;
    nar.voice = pick;
  }
  if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
    btnNarrate.hidden = true;
  } else {
    fillVoices();
    synth.addEventListener?.('voiceschanged', fillVoices);
    selVoice.onchange = () => {
      nar.voice = synth.getVoices().find((v) => v.name === selVoice.value) || null;
      try { localStorage.setItem('apimMigVoice', selVoice.value); } catch (e) { /* no storage */ }
      if (nar.on) goTo(currentStep()); // hear the new voice from the start of this step
    };
    btnNarrate.onclick = () => {
      nar.on = !nar.on;
      btnNarrate.setAttribute('aria-pressed', String(nar.on));
      selVoice.hidden = !nar.on || !selVoice.options.length;
      if (nar.on) {
        // start the current step again so the voice and the animation line up
        if (tl.progress() >= 1) tl.pause();
        goTo(currentStep());
      } else {
        narReset();
        setPlayLabel();
      }
    };
  }

  // ---------- live traffic ----------
  function polyline(pts) {
    const cum = [0];
    for (let i = 1; i < pts.length; i++) {
      cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    }
    return { pts, cum, len: cum[cum.length - 1] };
  }
  function pointAt(pl, d) {
    const { pts, cum } = pl;
    for (let i = 1; i < pts.length; i++) {
      if (d <= cum[i]) {
        const f = (d - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
        return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f];
      }
    }
    return pts[pts.length - 1];
  }
  // Routes depend on the deployment layout, so they are rebuilt with each scene.
  let R = null;
  function buildRoutes(s) {
    const G = s.G;
    return {
      toLB: CLIENTS.map(([x, y]) => polyline([[x + 16, y], LB_IN])),
      lbThrough: polyline([LB_IN, LB_OUT]),
      toNode: { src: polyline(linkPts(G, 0)), tgt: polyline(linkPts(G, DY)) },
      entry: { src: G.entry(0), tgt: G.entry(DY) },
      toBackend: { src: polyline(s.laneSrcPts), tgt: polyline(s.laneTgtPts) },
      backendPort: { src: [BE_X(), BACKEND_PORT.src], tgt: [BE_X(), BACKEND_PORT.tgt] },
      toDb: { src: G.cpDb(0).map(polyline), tgt: G.cpDb(DY).map(polyline), vm: vmGeo().links.map(polyline) },
      // IS -> its databases (normal changes), and where the IS migration writes
      isWr: hasIs() ? { src: s.isSrcLinkPts.map(polyline), tgt: s.isTgtLinkPts.map(polyline) } : null,
      isMig: hasIs() ? (s.isVm ? VM_IS.is.links() : s.isTgtLinkPts).map(polyline) : null,
    };
  }

  let packets = [];
  let rec = null; // set while a GIF is being made (see "GIF export")
  function addPacket(path, color, r, pxPerSec, onArrive) {
    const c = el('circle', { r, fill: color }, S.layerTraffic);
    const [x, y] = path.pts[0];
    c.setAttribute('cx', x);
    c.setAttribute('cy', y);
    packets.push({ path, d: 0, c, v: pxPerSec, onArrive });
  }
  function clearTraffic() { packets.forEach((p) => p.c.remove()); packets = []; }
  function ripple(x, y, color, size = 18) {
    const c = el('circle', { cx: x, cy: y, r: 4, fill: 'none', stroke: color, 'stroke-width': 2 }, S.layerTraffic);
    const tw = gsap.to(c, { attr: { r: size }, opacity: 0, duration: 0.6, ease: 'power1.out', onComplete: () => c.remove(), paused: !!rec });
    if (rec) rec.tweens.push(tw);
  }
  const now = () => stateAt(mode, tl, tl.time());

  function spawnRequest() {
    const i = Math.floor(Math.random() * CLIENTS.length);
    addPacket(R.toLB[i], C.packet, 5, 230, () => {
      const target = now().route;
      if (!target) { // load balancer is in maintenance: reject
        ripple(...LB_IN, C.bad, 16);
        return;
      }
      addPacket(R.lbThrough, C.packet, 5, 230, () => {
        addPacket(R.toNode[target], C.packet, 5, 230, () => {
          ripple(...R.entry[target], target === 'src' ? C.old : C.neu);
          // the gateway forwards the call to the backend
          addPacket(R.toBackend[target], C.packet, 5, 260, () => {
            ripple(...R.backendPort[target], C.backend);
          });
        });
      });
    });
  }
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  function spawnWrite(target, speedPx = 170, color = C.db) {
    const k = Math.random() < 0.5 ? 0 : 1;
    addPacket(R.toDb[target][k], color, 4, speedPx, null);
  }

  let last = performance.now(), accReq = 0, accWrite = 0, accMig = 0, accTest = 0;
  function frame(ts) {
    // while a GIF is being made, the recorder drives the animation instead
    if (!tl || playerEl.hidden || rec) { last = ts; requestAnimationFrame(frame); return; }
    const dt = Math.min(0.05, (ts - last) / 1000) * speed;
    last = ts;
    tick(dt);
    requestAnimationFrame(frame);
  }
  // Advance the live traffic by dt seconds of animation time.
  function tick(dt) {
    accReq += dt;
    accWrite += dt;
    accMig += dt;
    const st = now();
    if (accReq > 0.42) { accReq = 0; spawnRequest(); }
    if (accWrite > 1.5) {
      accWrite = 0;
      if (st.writes) {
        spawnWrite(st.writes);
        if (R.isWr && Math.random() < 0.6) addPacket(pick(R.isWr[st.writes]), C.db, 4, 170, null); // IS changes
      }
    }
    // test data on the new setup while it runs against fresh DBs
    accTest += dt;
    if (accTest > 0.7) {
      accTest = 0;
      if (st.freshTest) {
        // no calls go to the backend during this test; only test data in the fresh DBs
        spawnWrite('tgt', 170, C.fresh);
        if (R.isWr) addPacket(pick(R.isWr.tgt), C.fresh, 4, 170, null);
      }
    }
    // migration clients rewrite data in both target databases
    if (accMig > 0.12) {
      accMig = 0;
      if (st.migrating === 'ismig') addPacket(pick(R.isMig), C.db, 4, 260, null);
      else if (st.migrating) spawnWrite(S.vm ? 'vm' : 'tgt', 260);
    }
    const current = packets;
    const next = [];
    packets = []; // onArrive() adds the next hop here
    for (const p of current) {
      p.d += p.v * dt;
      if (p.d >= p.path.len) {
        p.c.remove();
        if (p.onArrive) p.onArrive();
      } else {
        const [x, y] = pointAt(p.path, p.d);
        p.c.setAttribute('cx', x);
        p.c.setAttribute('cy', y);
        next.push(p);
      }
    }
    packets = next.concat(packets);
    renderCaption();
    renderPanel(st);
  }

  // ---------- setup screen ----------
  const setupEl = document.getElementById('setup');
  const selSrc = document.getElementById('selSrc');
  const selTgt = document.getElementById('selTgt');
  const approachEl = document.getElementById('approach');
  const btnGo = document.getElementById('btnGo');
  const option = (v) => { const o = document.createElement('option'); o.value = v; o.textContent = `APIM ${v}`; return o; };
  const radio = (name) => document.querySelector(`input[name="${name}"]:checked`).value;
  const setRadio = (name, value) => { document.querySelector(`input[name="${name}"][value="${value}"]`).checked = true; };
  SOURCES.forEach((v) => selSrc.appendChild(option(v)));

  function fillTargets() {
    const keep = selTgt.value;
    selTgt.innerHTML = '';
    TARGETS.filter((t) => strategyFor(selSrc.value, t)).forEach((t) => selTgt.appendChild(option(t)));
    const opts = [...selTgt.options].map((o) => o.value);
    selTgt.value = opts.includes(keep) ? keep : opts[opts.length - 1];
    describe();
  }
  const kmField = document.getElementById('kmField');
  const kmdbField = document.getElementById('kmdbField');
  function updateKmField() {
    const allowed = kmAllowed(selSrc.value);
    kmField.hidden = !allowed;
    kmdbField.hidden = !allowed || radio('km') !== 'is';
    document.getElementById('kmHint').textContent = allowed
      ? `Current: ${isNameFor(selSrc.value)}. Target: IS ${isTgtVerFor(selTgt.value)}.` : '';
  }
  function describe() {
    updateKmField();
    const st = strategyFor(selSrc.value, selTgt.value);
    approachEl.classList.toggle('bad', !st);
    btnGo.disabled = !st;
    const k8s = radio('plat') === 'k8s';
    const vmNote = !st || !k8s || st === 'twostep' ? ''
      : st === 'client' ? ' The target runs on Kubernetes, so the migration clients run on a temporary all-in-one VM that is removed afterwards.'
      : ' No temporary VM is needed: only a SQL script runs.';
    const withIs = st && kmAllowed(selSrc.value) && radio('km') === 'is';
    const isNote = !withIs ? ''
      : selTgt.value === VIA
        ? ` <strong>IS as Key Manager:</strong> ${isNameFor(selSrc.value)} → IS 6.1.0. Both products are migrated together on the shared databases: the IS migration first, then only the API Manager component migration.`
        : ` <strong>IS as Key Manager:</strong> ${isNameFor(selSrc.value)} → IS 7.x. The databases are split per product, IS is migrated on its own, connected as a third-party Key Manager, then converted to work like the resident Key Manager.`;
    approachEl.innerHTML = st
      ? `<strong>${SCENARIOS[st].name}.</strong> ${SCENARIOS[st].summary()}${vmNote}${isNote}`
      : 'There is no documented direct path between these versions.';
  }
  selSrc.onchange = fillTargets;
  selTgt.onchange = describe;
  document.querySelectorAll('input[name="plat"], input[name="km"], input[name="kmdb"]').forEach((r) => { r.onchange = describe; });

  function syncUrl() {
    if (LOCK) return;
    const q = new URLSearchParams({ src: SRC, tgt: TARGET, dep: DEP, plat: PLAT, km: KM, kmdb: KMDB, downtime: mode === 'downtime' ? 'yes' : 'no' });
    history.replaceState(null, '', '?' + q);
  }
  function start(src, tgt, dep, plat, km, kmdb, downtime, opts = {}) {
    SRC = src;
    TARGET = tgt;
    DEP = dep === 'dist' ? 'dist' : 'aio';
    PLAT = plat === 'k8s' ? 'k8s' : 'vm';
    KM = km === 'is' && kmAllowed(src) ? 'is' : 'resident';
    KMDB = kmdb === 'shared' ? 'shared' : 'both';
    setupEl.hidden = true;
    playerEl.hidden = false;
    // The answer only sets where the downtime switch starts; it can be flipped any time.
    load(strategyFor(src, tgt), downtime ? 'downtime' : 'freeze', opts);
    syncUrl();
  }
  btnGo.onclick = () => start(selSrc.value, selTgt.value, radio('dep'), radio('plat'), radio('km'), radio('kmdb'),
    radio('downtime') === 'yes');
  document.getElementById('btnSetup').onclick = () => {
    narReset();
    if (tl) tl.pause();
    clearTraffic();
    selSrc.value = SRC;
    fillTargets();
    selTgt.value = TARGET;
    describe();
    setRadio('dep', DEP);
    setRadio('plat', PLAT);
    setRadio('km', KM);
    setRadio('kmdb', KMDB);
    setRadio('downtime', mode === 'downtime' ? 'yes' : 'no');
    playerEl.hidden = true;
    setupEl.hidden = false;
    history.replaceState(null, '', location.pathname);
  };

  // ---------- export for customer ----------
  // Saves this page as one standalone HTML file with the setup locked. The customer can still
  // switch downtime / freeze window, change speed and step through it. GSAP is inlined so the
  // file works offline; if it can't be fetched, the file keeps the CDN link.
  async function buildCustomerHtml(lock) {
    const lockJson = JSON.stringify(lock).replace(/</g, '\\u003c');
    // function replacements: the inserted text may contain "$" patterns
    let html = PRISTINE.replace('<script>\n(() => {',
      () => `<script>window.MIGRATION_LOCK = ${lockJson};<\/script>\n<script>\n(() => {`);
    const gsapTag = `<script src="${GSAP_URL}"><\/script>`;
    try {
      const code = await (await fetch(GSAP_URL)).text();
      if (code.length > 1000) {
        html = html.replace(gsapTag, () => '<script>' + code.replace(/<\/script/gi, '<\\/script') + '<\/script>');
      }
    } catch (e) { /* offline: keep the CDN link */ }
    return html;
  }
  async function exportForCustomer() {
    const who = window.prompt('Customer name to show on the page (optional):', '');
    if (who === null) return;
    const lock = { src: SRC, tgt: TARGET, dep: DEP, plat: PLAT, km: KM, kmdb: KMDB,
      downtime: mode === 'downtime' ? 'yes' : 'no', customer: who.trim().slice(0, 80) };
    const html = await buildCustomerHtml(lock);
    const slug = (x) => x.toLowerCase().replace(/[^a-z0-9.]+/g, '-').replace(/^-+|-+$/g, '');
    const name = ['apim-migration', SRC, 'to', TARGET, lock.customer && slug(lock.customer)].filter(Boolean).join('-') + '.html';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  document.getElementById('btnExport').onclick = exportForCustomer;

  // ---------- GIF and video export ----------
  // Both render the whole animation, from the start, at the speed chosen when the button is
  // pressed. Narration is turned off and the controls are locked while it runs. The recorder
  // steps the timeline and the live traffic on a fixed clock (not in real time), so no frame is
  // dropped however slow the machine is. Each frame is the SVG drawn onto a canvas, with the
  // title above and the current step below.
  // GIF: all frames share one palette, and pixels that did not change are left transparent,
  // which keeps the file small. Video: silent H.264 MP4 through the browser's WebCodecs encoder.
  const GIFENC_URL = 'https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js';
  const MP4MUX_URL = 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs';
  const GIF_FPS = 10;        // GIF frames per second of playback
  const VIDEO_FPS = 25;
  const VIDEO_BITRATE = 4e6;
  const EXP_SCALE = 0.9;     // output pixels per SVG unit
  const EXP_TOP = 64, EXP_BOTTOM = 50; // title and step bands, in output pixels
  const EXP_FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const btnGif = document.getElementById('btnGif');
  const btnVideo = document.getElementById('btnVideo');
  const gifStatus = document.getElementById('gifStatus');
  const gifMsg = document.getElementById('gifMsg');
  const gifBar = document.getElementById('gifBar');

  // A canvas sized for this scene. Video encoders need even dimensions.
  function exportCanvas() {
    const [, , vbW, vbH] = svg.getAttribute('viewBox').split(/\s+/).map(Number);
    const w = Math.round(vbW * EXP_SCALE / 2) * 2, svgH = Math.round(vbH * EXP_SCALE);
    const h = Math.ceil((EXP_TOP + svgH + EXP_BOTTOM) / 2) * 2;
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    return { canvas, ctx: canvas.getContext('2d', { willReadFrequently: true }), w, h, svgH };
  }

  // Draw the current state of the animation onto the export canvas.
  async function drawExportFrame({ ctx, w, h, svgH }) {
    ctx.fillStyle = css('--bg');
    ctx.fillRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w / 2, EXP_TOP, 0, w / 2, EXP_TOP, w * 0.7);
    g.addColorStop(0, '#17203a');
    g.addColorStop(1, css('--bg'));
    ctx.fillStyle = g;
    ctx.fillRect(0, EXP_TOP, w, svgH);
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', NS);
    clone.setAttribute('width', w);
    clone.setAttribute('height', svgH);
    clone.setAttribute('font-family', EXP_FONT);
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type: 'image/svg+xml' }));
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      ctx.drawImage(img, 0, EXP_TOP, w, svgH);
    } finally {
      URL.revokeObjectURL(url);
    }
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.text;
    ctx.font = `600 20px ${EXP_FONT}`;
    ctx.fillText(document.getElementById('title').textContent, 20, 30);
    const chips = [document.getElementById('chip'), document.getElementById('chipDep'),
      document.getElementById('chipPlat'), document.getElementById('chipKm')]
      .filter((c) => !c.hidden && c.textContent).map((c) => c.textContent);
    chips.push(mode === 'downtime' ? 'With downtime' : 'Without downtime (freeze window)');
    ctx.fillStyle = C.muted;
    ctx.font = `13px ${EXP_FONT}`;
    ctx.fillText(chips.join('  ·  '), 20, 52);
    const i = currentStep();
    const y = EXP_TOP + svgH + 32;
    const num = `Step ${i + 1} of ${STEPS.length}`;
    ctx.fillText(num, 20, y);
    const x = 20 + ctx.measureText(num).width + 16;
    ctx.fillStyle = C.text;
    ctx.font = `600 17px ${EXP_FONT}`;
    ctx.fillText(STEPS[i].title, x, y);
  }

  function lockControls(on) {
    playerEl.querySelectorAll('button, select').forEach((b) => {
      if (b.id === 'gifCancel') return;
      if (on) { b.dataset.wasDisabled = b.disabled ? '1' : ''; b.disabled = true; }
      else { b.disabled = b.dataset.wasDisabled === '1'; delete b.dataset.wasDisabled; }
    });
  }

  // Back to the first frame, with no traffic on screen.
  function rewindForExport() {
    clearTraffic();
    accReq = accWrite = accMig = accTest = 0;
    lastPanel = '';
    shownStep = -1;
    tl.seek(0, false);
    renderCaption();
    renderPanel(now());
  }
  // Move the animation on by perFrame seconds of animation time, in the same small steps as
  // the live loop. Ripples run in real time on the page; here they follow playback time.
  function advanceExport(perFrame, recSpeed) {
    const sub = Math.ceil(perFrame / 0.05);
    const dt = perFrame / sub;
    for (let k = 0; k < sub; k++) {
      tl.seek(Math.min(tl.duration(), tl.time() + dt), false);
      tick(dt);
      rec.tweens = rec.tweens.filter((tw) => { tw.time(tw.time() + dt / recSpeed); return tw.progress() < 1; });
    }
  }
  function exportProgress(label, recSpeed, done, total) {
    const pct = Math.round((Math.min(done, total) / total) * 100);
    gifBar.style.width = pct + '%';
    gifMsg.textContent = `Making ${label} at ${recSpeed}× · step ${currentStep() + 1} of ${STEPS.length} · ${pct}%`;
  }
  function exportName(recSpeed, ext) {
    return ['apim-migration', SRC, 'to', TARGET, DEP, PLAT, hasIs() ? 'is-km' : '', mode, `${recSpeed}x`]
      .filter(Boolean).join('-') + '.' + ext;
  }
  function saveFile(bytes, type, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], { type }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  // Lock the page, run make(recSpeed), then put the page back where the viewer was.
  async function runExport(label, make) {
    if (rec || !tl) return;
    if (nar.on) btnNarrate.click(); // narration off
    const recSpeed = speed;          // locked for the whole recording
    const prevTime = tl.time(), wasPlaying = playing();
    tl.pause();
    rec = { cancel: false, tweens: [] };
    lockControls(true);
    document.getElementById('gifCancel').textContent = 'Cancel';
    gifStatus.hidden = false;
    gifBar.style.width = '0%';
    gifMsg.textContent = `Loading the ${label} encoder…`;
    try {
      await make(recSpeed);
    } catch (e) {
      gifMsg.textContent = e.message === 'cancelled' ? `${label} cancelled.` : `Could not make the ${label}: ${e.message}`;
    } finally {
      rec.tweens.forEach((tw) => tw.progress(1));
      rec = null;
      clearTraffic();
      shownStep = -1;
      lastPanel = '';
      tl.seek(prevTime, false);
      renderCaption();
      renderPanel(now());
      if (wasPlaying && tl.progress() < 1) tl.play();
      lockControls(false);
      setPlayLabel();
      document.getElementById('gifCancel').textContent = 'Close';
      setTimeout(() => { if (!rec) gifStatus.hidden = true; }, 6000);
    }
  }
  const loadModule = (url) => import(url).catch(() => {
    throw new Error('the encoder is loaded from the internet; check the connection');
  });

  async function makeGif(recSpeed) {
    const { GIFEncoder, quantize, applyPalette } = await loadModule(GIFENC_URL);
    const cv = exportCanvas();
    const { ctx, w, h } = cv;

    // One palette for every frame, from a frame in the middle of each step plus the theme
    // colors (so traffic dots that are not in the samples keep their exact color).
    gifMsg.textContent = 'Preparing colors…';
    const samples = [];
    for (let k = 0; k < STEPS.length; k++) {
      const a = tl.labels[STEPS[k].label], b = STEPS[k + 1] ? tl.labels[STEPS[k + 1].label] : tl.duration();
      tl.seek(a + (b - a) * 0.6, false);
      shownStep = -1;
      renderCaption();
      renderPanel(now());
      await drawExportFrame(cv);
      const px = ctx.getImageData(0, 0, w, h).data;
      const keep = new Uint8Array(Math.ceil(px.length / 4 / 7) * 4);
      for (let p = 0, q = 0; p < px.length; p += 28, q += 4) keep.set(px.subarray(p, p + 4), q);
      samples.push(keep);
    }
    const swatch = Object.values(C).concat([css('--bg'), css('--panel-2'), '#17203a', '#c3cbe0']);
    const sw = new Uint8Array(swatch.length * 4 * 400);
    swatch.forEach((hex, k) => {
      const n = parseInt(hex.replace('#', ''), 16);
      for (let j = 0; j < 400; j++) sw.set([(n >> 16) & 255, (n >> 8) & 255, n & 255, 255], (k * 400 + j) * 4);
    });
    samples.push(sw);
    const all = new Uint8Array(samples.reduce((n, a) => n + a.length, 0));
    samples.reduce((o, a) => { all.set(a, o); return o + a.length; }, 0);
    const palette = quantize(all, 255);
    const TRANSPARENT = palette.length; // one extra slot marks unchanged pixels
    const fullPalette = palette.concat([[0, 0, 0]]);
    while (fullPalette.length < 256) fullPalette.push([0, 0, 0]);

    rewindForExport();
    const enc = GIFEncoder();
    const delayCs = Math.round(100 / GIF_FPS);     // frame delay in GIF time units (1/100 s)
    const perFrame = (recSpeed * delayCs) / 100;   // animation seconds per GIF frame
    const total = Math.ceil(tl.duration() / perFrame);
    let shown = null;
    for (let f = 0; f <= total; f++) {
      if (rec.cancel) throw new Error('cancelled');
      if (f > 0) advanceExport(perFrame, recSpeed);
      await drawExportFrame(cv);
      const idx = applyPalette(ctx.getImageData(0, 0, w, h).data, palette);
      const delay = f === total ? 3000 : delayCs * 10; // ms; hold the final frame
      if (!shown) {
        shown = idx;
        enc.writeFrame(idx, w, h, { palette: fullPalette, delay, dispose: 1 });
      } else {
        const out = new Uint8Array(idx.length);
        for (let p = 0; p < idx.length; p++) {
          if (idx[p] === shown[p]) out[p] = TRANSPARENT;
          else { out[p] = idx[p]; shown[p] = idx[p]; }
        }
        enc.writeFrame(out, w, h, { delay, transparent: true, transparentIndex: TRANSPARENT, dispose: 1 });
      }
      exportProgress('GIF', recSpeed, f, total);
      if (f % 5 === 0) await new Promise((res) => setTimeout(res, 0)); // let the page repaint
    }
    enc.finish();
    const bytes = enc.bytes();
    const name = exportName(recSpeed, 'gif');
    saveFile(bytes, 'image/gif', name);
    gifMsg.textContent = `GIF saved: ${name} (${total + 1} frames, ${(bytes.length / 1048576).toFixed(1)} MB)`;
  }

  // First H.264 profile this browser can encode at this size: High, then Main, then Baseline.
  async function pickVideoConfig(w, h) {
    for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42e028']) {
      const config = { codec, width: w, height: h, bitrate: VIDEO_BITRATE, framerate: VIDEO_FPS, avc: { format: 'avc' } };
      try {
        if ((await VideoEncoder.isConfigSupported(config)).supported) return config;
      } catch (e) { /* try the next one */ }
    }
    return null;
  }

  async function makeVideo(recSpeed) {
    if (typeof VideoEncoder === 'undefined' || typeof VideoFrame === 'undefined') {
      throw new Error('this browser cannot encode video. Use Chrome or Edge');
    }
    const { Muxer, ArrayBufferTarget } = await loadModule(MP4MUX_URL);
    const cv = exportCanvas();
    const { canvas, w, h } = cv;
    const config = await pickVideoConfig(w, h);
    if (!config) throw new Error('this browser has no H.264 encoder. Use Chrome or Edge');
    const muxer = new Muxer({
      target: new ArrayBufferTarget(),
      video: { codec: 'avc', width: w, height: h, frameRate: VIDEO_FPS },
      fastStart: 'in-memory',
    });
    let encError = null;
    const encoder = new VideoEncoder({
      output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
      error: (e) => { encError = e; },
    });
    encoder.configure(config);

    rewindForExport();
    const perFrame = recSpeed / VIDEO_FPS;      // animation seconds per video frame
    const total = Math.ceil(tl.duration() / perFrame);
    const frames = total + 1 + VIDEO_FPS * 3;   // plus 3 s on the final frame
    const us = 1e6 / VIDEO_FPS;
    try {
      for (let f = 0; f < frames; f++) {
        if (rec.cancel) throw new Error('cancelled');
        if (encError) throw encError;
        if (f <= total) {
          if (f > 0) advanceExport(perFrame, recSpeed);
          await drawExportFrame(cv);
        }
        const frame = new VideoFrame(canvas, { timestamp: Math.round(f * us), duration: Math.round(us) });
        encoder.encode(frame, { keyFrame: f % (VIDEO_FPS * 5) === 0 }); // a full frame every 5 s
        frame.close();
        // don't run ahead of the encoder
        while (encoder.encodeQueueSize > 6) await new Promise((res) => setTimeout(res, 5));
        exportProgress('video', recSpeed, f, frames - 1);
        if (f % 10 === 0) await new Promise((res) => setTimeout(res, 0)); // let the page repaint
      }
      await encoder.flush();
      if (encError) throw encError;
    } finally {
      if (encoder.state !== 'closed') encoder.close();
    }
    muxer.finalize();
    const bytes = muxer.target.buffer;
    const name = exportName(recSpeed, 'mp4');
    saveFile(bytes, 'video/mp4', name);
    gifMsg.textContent = `Video saved: ${name} (${Math.round(frames / VIDEO_FPS)} s, ${(bytes.byteLength / 1048576).toFixed(1)} MB)`;
  }

  btnGif.onclick = () => runExport('GIF', makeGif);
  btnVideo.onclick = () => runExport('video', makeVideo);
  document.getElementById('gifCancel').onclick = () => { if (rec) rec.cancel = true; else gifStatus.hidden = true; };

  // ?src=3.2.0&tgt=4.7.0&dep=aio|dist&plat=vm|k8s&km=resident|is&kmdb=both|shared&downtime=yes|no
  // skips the setup screen.
  // ?step=N opens paused at the end of step N; ?at=<label> opens paused just after a timeline label.
  const qs = new URLSearchParams(location.search);
  if (LOCK) {
    // customer file: no setup screen, no export, no GIF or video
    document.getElementById('btnSetup').hidden = true;
    document.getElementById('btnExport').hidden = true;
    btnGif.hidden = true;
    btnVideo.hidden = true;
    if (LOCK.customer) {
      const pf = document.getElementById('preparedFor');
      pf.textContent = `Prepared for ${LOCK.customer}`;
      pf.hidden = false;
    }
    start(LOCK.src, LOCK.tgt, LOCK.dep, LOCK.plat, LOCK.km, LOCK.kmdb, LOCK.downtime === 'yes',
      { step: parseInt(qs.get('step'), 10) });
    document.title = `APIM ${LOCK.src} → ${LOCK.tgt} migration`;
  } else if (qs.get('src') && qs.get('tgt') && strategyFor(qs.get('src'), qs.get('tgt'))) {
    start(qs.get('src'), qs.get('tgt'), qs.get('dep'), qs.get('plat'), qs.get('km'), qs.get('kmdb'),
      qs.get('downtime') === 'yes', { step: parseInt(qs.get('step'), 10) });
    if (qs.get('at') in tl.labels) {
      tl.pause().seek(tl.labels[qs.get('at')] + 0.8);
      renderCaption();
      setPlayLabel();
    }
  } else {
    selSrc.value = '4.2.0';
    fillTargets();
    setupEl.hidden = false;
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
